# OpenOCD config for GD32F150 (Cortex-M3, flash IP compatible with STM32F1x)
# Adapter: CMSIS-DAP (e.g. WCH-LinkE, USB id 1a86:8011). Swap the interface
# line below if you're using an ST-Link or J-Link instead.

source [find interface/cmsis-dap.cfg]
transport select swd

# GD32F150's SWD IDCODE doesn't match STM32F1's, so force it before the
# target script probes it, otherwise OpenOCD reports "unknown device".
set CPUTAPID 0x1ba01477

source [find target/stm32f1x.cfg]

reset_config srst_nogate
